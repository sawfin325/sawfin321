<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact | Chrono24</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="site-header"></div>
  <div class="wrap page-head">
    <div class="crumbs"><a href="index.html">Home</a> / Contact</div>
    <h1>Personalized support</h1>
    <p>Questions about a listing, a shipment, or selling? Send a note — this form stays in your browser.</p>
  </div>
  <section class="section wrap">
    <form class="form" id="contact-form">
      <label>Your name <input name="name" required /></label>
      <label>Email <input type="email" name="email" required /></label>
      <label>Topic
        <select name="topic">
          <option>Buyer Protection</option>
          <option>A listing</option>
          <option>Selling</option>
          <option>Technical</option>
        </select>
      </label>
      <label>Message <textarea name="msg" rows="6" required></textarea></label>
      <p><button class="btn" type="submit">Send message</button></p>
      <p class="notice" id="contact-note" hidden>Message recorded locally. In a live site this would reach support.</p>
    </form>
  </section>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("contact-form").addEventListener("submit", (e) => {
      e.preventDefault();
      document.getElementById("contact-note").hidden = false;
      toast("Message saved.");
    });
  </script>
</body>
</html>
