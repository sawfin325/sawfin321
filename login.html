<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in or register | luxerywatchsales</title>
  <link rel="icon" href="assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/app.css?v=11" />
</head>
<body>
  <div id="site-header"></div>
  <div class="auth">
    <h1>Log in or register</h1>
    <p>Save watches, message dealers, and manage listings.</p>
    <form class="form" id="auth-form">
      <label>Name <input name="name" required placeholder="Your name" /></label>
      <label>Email <input name="email" type="email" required placeholder="you@email.com" /></label>
      <label>Password <input name="password" type="password" required minlength="6" /></label>
      <p><button class="btn btn-block" type="submit">Continue</button></p>
      <p style="color:var(--muted);font-size:13px">Demo only — credentials stay in this browser and are never sent to a server.</p>
    </form>
  </div>
  <div id="site-footer"></div>
  <script src="js/data.js?v=10"></script>
  <script src="js/scene.js?v=10"></script>
  <script src="js/blog.js?v=10"></script>
  <script src="js/app.js?v=11"></script>
  <script>
    document.getElementById("auth-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      localStorage.setItem("meridian-user", JSON.stringify({ name: fd.get("name"), email: fd.get("email") }));
      location.href = "account.html";
    });
  </script>
</body>
</html>
