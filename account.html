<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your account | meridian</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="site-header"></div>
  <div class="wrap page-head" style="max-width:720px">
    <div class="crumbs"><a href="index.html">Home</a> / Account</div>
    <h1>Account</h1>
    <div id="account-box"></div>
  </div>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    const user = JSON.parse(localStorage.getItem("meridian-user") || "null");
    const box = document.getElementById("account-box");
    if (!user) {
      box.innerHTML = `<p>You are not signed in.</p><p><a class="btn" href="login.html">Log in or register</a></p>`;
    } else {
      box.innerHTML = `<p>Signed in as <strong>${user.name}</strong> (${user.email}).</p>
        <p><a class="btn btn-outline" href="collection.html">Open collection</a>
        <button class="btn" id="out">Log out</button></p>`;
      document.getElementById("out").onclick = () => {
        localStorage.removeItem("meridian-user");
        location.href = "index.html";
      };
    }
  </script>
</body>
</html>
